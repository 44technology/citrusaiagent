<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>US Citrus & Grape Imports · ABD Narenciye & Üzüm İthalatı</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#f5f6f2;--card:#fff;--ink:#1b2316;--muted:#6b7464;--line:#e2e6dc;--brand:#2f5a1f;--brand2:#5b8a3a;--soft:#eef3e7;--up:#2e8b3a;--down:#c0392b;--heat:47,107,58}
@media (prefers-color-scheme:dark){:root{--bg:#121510;--card:#1b1f18;--ink:#eef2ea;--muted:#a1aa99;--line:#2f362a;--brand:#9cc77a;--brand2:#7fae5c;--soft:#232a1e;--up:#6fcf7a;--down:#ef7b6b;--heat:127,174,92}}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
header{background:var(--card);border-bottom:1px solid var(--line);padding:18px 26px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
h1{font-size:20px;margin:0}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
main{display:grid;gap:18px;min-width:0;align-content:start}
.layout{display:grid;grid-template-columns:272px minmax(0,1fr);gap:22px;max-width:1880px;margin:0 auto;padding:20px 24px}
aside.side{position:sticky;top:16px;align-self:start;max-height:calc(100vh - 32px);overflow:auto;display:flex;flex-direction:column;gap:14px}
.side .card{padding:16px}
.sideh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:15px}
.link{background:none;border:0;color:var(--brand2);cursor:pointer;font:inherit;font-size:12.5px;padding:0}
.side .f{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.side label{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.side select{width:100%;min-width:0}
.side .seg{display:grid;grid-template-columns:1fr 1fr;width:100%}
.side .seg button{border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:left;font-size:13px;padding:8px 10px}
.side .seg button:nth-child(2n){border-right:0}
.nav{display:flex;flex-direction:column;gap:2px;padding:10px!important}
.nav a{display:block;padding:7px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:13.5px;border-left:3px solid transparent}
.nav a:hover{background:var(--soft)}
.nav a.on{background:var(--soft);font-weight:600;border-left-color:var(--brand2)}
main>.card,main>div{scroll-margin-top:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
h2{font-size:16px;margin:0 0 4px}
h3{font-size:14px;margin:14px 0 6px}
.hint{color:var(--muted);font-size:13px;margin:0 0 12px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer;font:inherit;font-weight:500}
.btn:hover{border-color:var(--brand2)}
.bar{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end}
.bar .f{display:flex;flex-direction:column;gap:5px}
.bar label{font-size:12px;font-weight:600;color:var(--muted)}
select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;min-width:160px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--ink);padding:8px 12px;font:inherit;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--brand);color:#fff}
@media (prefers-color-scheme:dark){.seg button.on{color:#10140d}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.kpi .l{color:var(--muted);font-size:13px}
.kpi .v{font-size:28px;font-weight:700;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.kpi .s{color:var(--muted);font-size:12.5px}
.kpi .y{font-size:12.5px;margin-top:4px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--card);position:sticky;top:0;z-index:1}
th .s{font-weight:400}
td.n,th.n{text-align:right;white-space:nowrap}
tbody tr:hover{background:var(--soft)}
.tw{max-height:560px;overflow:auto}
.pill{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--ink);white-space:nowrap}
.big{font-weight:600}
.muted{color:var(--muted)}
.up{color:var(--up)} .down{color:var(--down)}
.two{display:grid;grid-template-columns:1.6fr 1fr;gap:18px}
.half{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:960px){.two,.half{grid-template-columns:1fr}}
.chart{position:relative;height:330px}
.more{margin-top:10px}
footer{color:var(--muted);font-size:12.5px;padding:4px 2px 30px;line-height:1.6}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none;max-width:90vw;z-index:9}
.toast.show{opacity:1}
.wm{position:fixed;right:12px;bottom:8px;font-size:11px;color:var(--muted);opacity:.55;pointer-events:none;z-index:7}
.drop-over{outline:3px dashed var(--brand2);outline-offset:-10px}
svg.spark{display:block}
.range{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:13.5px}
.heat td{text-align:center;font-size:12px;padding:6px 4px;border:1px solid var(--card)}
.heat td:first-child{text-align:left;white-space:nowrap;font-size:13px;padding-right:10px}
.heat th{text-align:center;padding:6px 4px}
.heat th.cur{color:var(--ink);text-decoration:underline}
.ctx{display:inline-block;background:var(--soft);border-radius:8px;padding:6px 10px;font-size:13px;margin-bottom:10px}
.calc{display:grid;grid-template-columns:1fr 1fr;gap:22px}
@media(max-width:960px){.calc{grid-template-columns:1fr}}
.inp{display:grid;grid-template-columns:1fr 130px;gap:8px 12px;align-items:center}
.inp label{font-size:13px}
.inp small{display:block;color:var(--muted);font-size:11.5px}
.inp input{padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;text-align:right;width:100%}
.inp .grp{grid-column:1/-1;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-top:8px;border-top:1px solid var(--line);padding-top:10px}
.inp .grp.first{margin-top:0;border-top:0;padding-top:0}
.res table td{padding:8px 10px}
.res .tot td{font-weight:700;border-top:2px solid var(--ink)}
.box{background:var(--soft);border-radius:10px;padding:14px;margin-top:14px}
.box .v{font-size:24px;font-weight:700}
.warn{font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.5}
.hdr-r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:8}
.overlay.on{display:flex}
.overlay .card{max-width:460px}
main>*,.half>*,.two>*,.calc>*,.kpis>*{min-width:0}
.ftoggle{display:none}
.fclose{display:none}
.mo{display:none}
.tw{-webkit-overflow-scrolling:touch}
@media(max-width:1100px){
  .layout{display:block;padding:0 12px 12px}
  aside.side{position:sticky;top:0;z-index:6;background:var(--bg);margin:0 -12px 12px;padding:8px 12px 6px;gap:6px;max-height:none;overflow:visible;border-bottom:1px solid var(--line)}
  aside.side.open{max-height:100vh;max-height:100dvh;overflow:auto}
  .ftoggle{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;font-size:13.5px;cursor:pointer}
  .ftoggle b{white-space:nowrap}
  .ftoggle .fs{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
  aside.side .fcard{display:none}
  aside.side.open .fcard{display:block}
  aside.side.open .nav{display:none!important}
  .fclose{display:block;width:100%;margin-top:14px;background:var(--brand);color:#fff;border-color:var(--brand)}
  .nav{display:flex!important;flex-direction:row;gap:6px;padding:0!important;border:0!important;background:none!important;overflow-x:auto;scrollbar-width:none;white-space:nowrap}
  .nav::-webkit-scrollbar{display:none}
  .nav a{flex:0 0 auto;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12.5px;background:var(--card);border-left-width:1px}
  .nav a.on{border-color:var(--brand2);border-left-color:var(--brand2)}
  main>.card,main>div{scroll-margin-top:104px}
  main{gap:12px}
}
@media (max-width:1100px) and (prefers-color-scheme:dark){.fclose{color:#10140d}}
@media(max-width:700px){
  body{font-size:13.5px}
  header{padding:12px 14px;gap:8px}
  h1{font-size:17px}
  .sub{font-size:11.5px;line-height:1.4}
  .lgt{display:none}
  .hdr-r{gap:8px}
  .hdr-r .btn,.hdr-r .seg button{padding:7px 10px;font-size:13px}
  select,input,.inp input{font-size:16px!important}
  .card{padding:14px;border-radius:10px}
  h2{font-size:15px}
  .hint{font-size:12.5px}
  .range{padding:10px 12px;font-size:12.5px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi .v{font-size:20px;overflow-wrap:anywhere}
  #k4{font-size:15px!important;line-height:1.25}
  .kpi .l,.kpi .s,.kpi .y{font-size:11.5px}
  .chart{height:300px}
  th,td{padding:7px 8px}
  .tw{max-height:70vh}
  .tw table{min-width:560px}
  #prices,#halLatest{min-width:860px}
  #cenTbl{min-width:680px}
  #heat{min-width:620px}
  #cRes{min-width:0}
  .heat td:first-child,.heat th:first-child{position:sticky;left:0;background:var(--card);z-index:1;white-space:normal;min-width:120px}
  .inp{grid-template-columns:minmax(0,1fr) 108px;gap:8px 10px}
  .box .v{font-size:20px}
  .mo{display:inline}
  /* flows table -> card list */
  #flowsW{max-height:none;overflow:visible}
  #flows{min-width:0}
  #flows thead{display:none}
  #flows,#flows tbody{display:block}
  #flows tr{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"p t" "o y" "port port" "f f" "l l";gap:3px 12px;padding:11px 0;border-bottom:1px solid var(--line)}
  #flows tr:hover{background:none}
  #flows td{border:0;padding:0;text-align:left;white-space:normal}
  #flows .cp{grid-area:p;font-size:14.5px}
  #flows .ct{grid-area:t;text-align:right;font-size:14.5px;white-space:nowrap}
  #flows .co{grid-area:o}
  #flows .cy{grid-area:y;text-align:right;font-size:12px;color:var(--muted);white-space:nowrap}
  #flows .cy div{display:inline;margin-left:4px}
  #flows .cport{grid-area:port;color:var(--muted);font-size:12.5px}
  #flows .cs{display:none}
  #flows .cf{grid-area:f;margin-top:3px}
  #flows .cf>div{display:inline;margin-left:6px}
  #flows .cl{grid-area:l;font-size:12px}
}
code{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:3px 7px;font-size:12.5px;display:inline-block;margin-top:6px;overflow-wrap:anywhere}
@media(max-width:700px){#h10Tbl{min-width:520px}}
</style>
</head>
<body>
<header>
  <div>
    <h1 data-i="title"></h1>
    <div class="sub" id="dataInfo"></div>
  </div>
  <div class="hdr-r">
    <div class="seg" id="lang"><button data-v="tr">🇹🇷 TR<span class="lgt"> · Türkçe</span></button><button data-v="en">🇺🇸 EN<span class="lgt"> · English</span></button></div>
    <button class="btn" id="upBtn" data-i="upload"></button>
    <input type="file" id="file" accept=".csv" multiple hidden>
  </div>
</header>

<div class="layout">
<aside class="side" id="side">
  <button class="ftoggle" id="fToggle" type="button"><b data-i="filtersBtn"></b><span class="fs" id="fSum"></span><span id="fArrow">▾</span></button>
  <div class="card fcard">
    <div class="sideh"><b data-i="filtersT"></b><button class="link" id="resetF" data-i="resetF"></button></div>
    <div class="f"><label data-i="fProd"></label><select id="fProd"></select></div>
    <div class="f"><label data-i="fOrig"></label><select id="fOrig"></select></div>
    <div class="f"><label data-i="fMode"></label>
      <div class="seg" id="fMode">
        <button data-v="Boat" class="on" data-i="mBoat"></button>
        <button data-v="Truck" data-i="mTruck"></button>
        <button data-v="Air" data-i="mAir"></button>
        <button data-v="" data-i="mAll"></button>
      </div>
    </div>
    <div class="f"><label data-i="fPort"></label><select id="fPort"></select></div>
    <div class="f" style="margin-bottom:0"><label data-i="fPer"></label>
      <div class="seg" id="fPer">
        <button data-v="7" data-i="p7"></button>
        <button data-v="14" data-i="p14"></button>
        <button data-v="28" class="on" data-i="p28"></button>
        <button data-v="84" data-i="p84"></button>
        <button data-v="ytd" data-i="pytd"></button>
        <button data-v="365" data-i="p365"></button>
        <button data-v="0" data-i="p0"></button>
      </div>
    </div>
    <button class="btn fclose" id="fClose" type="button" data-i="fClose"></button>
  </div>
  <nav class="card nav" id="nav">
    <a href="#s-kpis" data-i="nKpi"></a>
    <a href="#s-flows" data-i="nFlows"></a>
    <a href="#s-week" data-i="nWeek"></a>
    <a href="#s-years" data-i="nYears"></a>
    <a href="#s-cal" data-i="nCal"></a>
    <a href="#s-fob" data-i="nFob"></a>
    <a href="#s-hal" data-i="nHal"></a>
    <a href="#s-hal10" data-i="nH10"></a>
    <a href="#s-cen" data-i="nCen"></a>
    <a href="#s-calc" data-i="nCalc"></a>
  </nav>
</aside>
<main>
  <div class="range" id="rangeInfo"></div>

  <div class="kpis" id="s-kpis">
    <div class="card kpi"><div class="l" data-i="k1"></div><div class="v" id="k1">–</div><div class="s" id="k1s"></div><div class="y" id="k1y"></div></div>
    <div class="card kpi"><div class="l" data-i="k2"></div><div class="v" id="k2">–</div><div class="s" data-i="k2s"></div><div class="y" id="k2y"></div></div>
    <div class="card kpi"><div class="l" data-i="k3"></div><div class="v" id="k3">–</div><div class="s" id="k3s"></div></div>
    <div class="card kpi"><div class="l" data-i="k4"></div><div class="v" id="k4" style="font-size:22px">–</div><div class="s" id="k4s"></div></div>
  </div>

  <div class="card" id="s-flows">
    <h2 data-i="flowsT"></h2>
    <p class="hint" data-i="flowsH"></p>
    <div class="tw" id="flowsW"><table id="flows"></table></div>
    <button class="btn more" id="moreBtn"></button>
  </div>

  <div class="two" id="s-week">
    <div class="card">
      <h2 data-i="weekT"></h2>
      <p class="hint" data-i="weekH"></p>
      <div class="chart"><canvas id="cWeek"></canvas></div>
    </div>
    <div class="card">
      <h2 data-i="portT"></h2>
      <p class="hint" data-i="portH"></p>
      <div class="chart"><canvas id="cPort"></canvas></div>
    </div>
  </div>

  <div class="card" id="s-years">
    <h2 data-i="yearT"></h2>
    <p class="hint" data-i="yearH"></p>
    <div class="half">
      <div><h3 data-i="yearVolT"></h3><div class="chart"><canvas id="cYearVol"></canvas></div></div>
      <div><h3 data-i="yearPriceT"></h3><div class="chart" id="yearPriceBox"><canvas id="cYearPrice"></canvas></div><p class="hint" id="yearPriceNote"></p></div>
    </div>
  </div>

  <div class="card" id="s-cal">
    <h2 data-i="calT"></h2>
    <p class="hint" id="calH"></p>
    <div class="tw"><table class="heat" id="heat"></table></div>
  </div>

  <div class="card" id="s-fob">
    <h2 data-i="priceT"></h2>
    <p class="hint" data-i="priceH"></p>
    <div class="tw"><table id="prices"></table></div>
  </div>

  <div class="card" id="s-hal">
    <h2 data-i="halT"></h2>
    <p class="hint" data-i="halH"></p>
    <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:10px"><div class="ctx" id="halCtx" style="margin:0"></div><label class="muted" style="font-size:12px;font-weight:600" data-i="gradeL"></label><select id="halGrade"></select></div>
    <div class="half">
      <div><h3 data-i="chainT"></h3><div class="chart"><canvas id="cChain"></canvas></div></div>
      <div><h3 id="markupT"></h3><div class="tw"><table id="markup"></table></div></div>
    </div>
    <h3 data-i="latestHalT"></h3>
    <div class="tw" style="max-height:420px"><table id="halLatest"></table></div>
    <p class="hint" style="margin-top:8px" data-i="gradeNote"></p>
  </div>

  <div class="card" id="s-hal10">
    <h2 data-i="h10T"></h2>
    <p class="hint" data-i="h10H"></p>
    <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:10px"><div class="ctx" id="h10Ctx" style="margin:0"></div><label class="muted" style="font-size:12px;font-weight:600" data-i="h10MkL"></label><select id="h10Mk"></select></div>
    <div class="box" id="h10Hint" style="margin:0 0 12px"></div>
    <div class="half">
      <div><h3 data-i="h10YearT"></h3><div class="chart" style="height:380px"><canvas id="cH10Year"></canvas></div></div>
      <div><h3 data-i="h10AvgT"></h3><div class="chart" style="height:380px"><canvas id="cH10Avg"></canvas></div></div>
    </div>
    <h3 data-i="h10LongT"></h3>
    <div class="chart"><canvas id="cH10Long"></canvas></div>
    <h3 data-i="h10TblT"></h3>
    <div class="tw" style="max-height:420px"><table id="h10Tbl"></table></div>
    <p class="hint" style="margin-top:8px" data-i="h10Note"></p>
  </div>

  <div class="card" id="s-cen">
    <h2 data-i="cenT"></h2>
    <p class="hint" data-i="cenH"></p>
    <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:10px"><div class="ctx" id="cenCtx" style="margin:0"></div>
      <label class="muted" style="font-size:12px;font-weight:600" data-i="cenDistL"></label><select id="cenDist"></select></div>
    <div class="tw" style="max-height:440px"><table id="cenTbl"></table></div>
    <p class="hint" id="cenNote" style="margin-top:8px"></p>
    <div class="half">
      <div><h3 id="cenChainT"></h3><div class="chart"><canvas id="cCenChain"></canvas></div></div>
      <div><h3 data-i="cenOrigT"></h3><div class="chart"><canvas id="cCenOrig"></canvas></div></div>
    </div>
  </div>

  <div class="card" id="s-calc">
    <h2 style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><span data-i="calcT"></span><button class="btn" id="cClear" data-i="cClear" style="font-size:13px;padding:6px 12px"></button></h2>
    <p class="hint" data-i="calcH"></p>
    <div class="calc">
      <div class="inp">
        <div class="grp first" data-i="gProd"></div>
        <label data-i="lSel" style="grid-column:1/-1;margin-bottom:-4px"></label><select id="cSel" style="min-width:0;width:100%;grid-column:1/-1"></select>
        <label><span data-i="lSale"></span><small id="cMktNote"></small></label><input id="cSale" type="number" step="0.01">
        <label data-i="lKg"></label><input id="cKg" type="number" step="0.1">
        <label><span data-i="lBoxes"></span><small data-i="lBoxesS"></small></label><input id="cBoxes" type="number" step="1">
        <div class="grp" data-i="gBuy"></div>

  list.forEach(x=>{const sp=x.u!=null&&x.a.fob?(x.u-x.a.fob)/x.a.fob*100:null;
    h+=`<tr><td class="big">${oName(x.o)}</td><td class="n">${x.a.kg/1000<20?`<span class="pill" title="${tt('tinyT')}">⚠</span> `:''}${fmt(x.a.kg/1000)}</td><td class="n big">${$k(x.a.fob)}</td><td class="n">${$k(x.a.cif)}</td><td class="n">${$k(x.a.fr)}</td><td class="n">${$k(x.la.fob)}<div class="muted" style="font-size:12px">${mF(x.lm)}</div></td><td class="n">${$k(x.u)}</td><td class="n">${x.a.cnt!=null?tt('pct',fmt(x.a.cnt*100)):'–'}</td></tr>`});
  if(!list.length) h+=`<tr><td colspan="8" class="muted">${tt('noCen')}</td></tr>`;
  $('#cenTbl').innerHTML=h+'</tbody>';
  $('#cenNote').textContent=tt('cenWarn')+' '+(p==='grapes'?tt('cenGrapes')+' ':'')+tt('cenMiami');
  // chain chart for one origin
  const o=F.orig||(list[0]||{}).o;
  $('#cenChainT').textContent=tt('cenChainT',o?oName(o):'–');
  const orow=rows.filter(r=>r.o===o);
  const mAll=months;
  const cm=mAll.map(m=>cagg(orow.filter(r=>r.t===m)));
  const um=mAll.map(m=>{const a=PRICE.filter(x=>x.c===p&&x.o===o&&x.mid!=null&&x.kg&&x.d.slice(0,7)===m).map(x=>x.mid/x.kg);return a.length?avg(a):null});
  const hm=mAll.map(m=>{const a=HAL.filter(x=>x.c===p&&x.o===o&&x.kg&&x.d.slice(0,7)===m).map(x=>x.mid/x.kg);return a.length?avg(a):null});
  const dark=getComputedStyle(document.body).backgroundColor!=='rgb(245, 246, 242)';
  mkChart('cCenChain',{type:'line',data:{labels:mAll.map(mF),datasets:[
    {label:tt('lCenFob'),data:cm.map(a=>a.fob),borderColor:PAL[0],backgroundColor:PAL[0],borderWidth:3,pointRadius:2,spanGaps:false},
    {label:tt('lCenCif'),data:cm.map(a=>a.cif),borderColor:PAL[2],backgroundColor:PAL[2],borderWidth:1.5,borderDash:[4,3],pointRadius:1,spanGaps:false},
    {label:tt('lUsdaFob'),data:um,borderColor:dark?'#eef2ea':'#1b2316',backgroundColor:dark?'#eef2ea':'#1b2316',borderWidth:2.5,pointRadius:2,spanGaps:false},
    {label:tt('lHal'),data:hm,borderColor:PAL[1],backgroundColor:PAL[1],borderWidth:2,pointRadius:2,spanGaps:false}]},
    options:{maintainAspectRatio:false,animation:false,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'bottom',labels:{color:ink(),boxWidth:12}},tooltip:{callbacks:{label:c=>c.raw==null?null:`${c.dataset.label}: $${fmt(c.raw,2)}/kg`}}},
    scales:{x:{ticks:{color:ink(),maxRotation:60}},y:{ticks:{color:ink(),callback:v=>'$'+Number(v).toFixed(2)},title:{display:true,text:'$ / kg',color:ink()}}}}});
  // by origin chart
  const tops=Object.entries(rows.reduce((m,r)=>{m[r.o]=(m[r.o]||0)+r.kg;return m},{})).sort((a,b)=>b[1]-a[1]).slice(0,6).map(e=>e[0]);
  const sel=F.orig&&!tops.includes(F.orig)?[F.orig,...tops.slice(0,5)]:tops;
  mkChart('cCenOrig',{type:'line',data:{labels:mAll.map(mF),datasets:sel.map((oo,i)=>({label:oName(oo),data:mAll.map(m=>cagg(rows.filter(r=>r.o===oo&&r.t===m)).fob),borderColor:PAL[i],backgroundColor:PAL[i],borderWidth:oo===F.orig?3:1.8,pointRadius:1.5,spanGaps:false}))},
    options:{maintainAspectRatio:false,animation:false,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'bottom',labels:{color:ink(),boxWidth:12}},tooltip:{callbacks:{label:c=>c.raw==null?null:`${c.dataset.label}: $${fmt(c.raw,2)}/kg`}}},
    scales:{x:{ticks:{color:ink(),maxRotation:60}},y:{ticks:{color:ink(),callback:v=>'$'+Number(v).toFixed(2)},title:{display:true,text:'$ / kg',color:ink()}}}}});
}

// ================= calculator =================
const CK=['cSale','cKg','cBoxes','cFob','cFreight','cPortFee','cInsp','cInland','cOther','cDuty','cMargin'];
let CSTORE={}; try{CSTORE=JSON.parse(localStorage.getItem('sf_calc')||'{}')}catch(e){}
let COPTS=[], calcInit=false;
function calcOptions(){
  const fp=r=>(!F.prod||r.c===F.prod)&&(!F.orig||r.o===F.orig);
  const out=[{k:'manual',src:'man'}];
  const grp=(rows,keyf,lim)=>{const m=new Map();rows.forEach(r=>{if(r.mid==null||r.d<lim||!fp(r))return;const k=keyf(r);const g=m.get(k);if(!g||g.d<r.d)m.set(k,{d:r.d,rows:[r]});else if(g.d===r.d)g.rows.push(r)});return m};
  const fob=[...grp(PRICE,p=>[p.c,p.o,p.v,p.pkg].join('|'),addDays(META.pTo||'2000-01-01',-120))].map(([k,g])=>{const p=g.rows[0];const lo=Math.min(...g.rows.map(q=>q.mlo??q.lo)),hi=Math.max(...g.rows.map(q=>q.mhi??q.hi));return {k:'fob|'+k,src:'fob',c:p.c,o:p.o,v:p.v,pkg:p.pkg,kg:p.kg,d:g.d,lo,hi,mid:(lo+hi)/2}});
  const hal=[...grp(HAL.filter(r=>!US_STATES.has(r.o)),r=>[r.c,r.o,r.v,r.pkg,r.slug].join('|'),addDays(META.hTo||'2000-01-01',-45))].map(([k,g])=>{const r=g.rows[0];return {k:'hal|'+k,src:'hal',mk:r.mk,c:r.c,o:r.o,v:r.v,pkg:r.pkg,kg:r.kg,d:g.d,lo:Math.min(...g.rows.map(q=>q.lo)),hi:Math.max(...g.rows.map(q=>q.hi)),mid:avg(g.rows.map(q=>q.mid))}});
  const srt=(a,b)=>prodName(a.c).localeCompare(prodName(b.c),loc())||ctry(a.o).localeCompare(ctry(b.o),loc())||b.d.localeCompare(a.d);
  return out.concat(fob.sort(srt),hal.sort(srt));
}
function optLabel(o){
  if(o.src==='man') return tt('optMan');
  return `${prodName(o.c)} – ${ctry(o.o)}${o.v?' – '+tc(o.v):''} · ${o.kg?fmt(o.kg,1)+' kg':tt('kgQ')}${o.src==='hal'?' · '+o.mk:''} · ${dF(o.d)}`;
}
function setupCalc(){
  const keep=COPTS[+$('#cSel').value]?.k;
  COPTS=calcOptions();
  const grp=(src,lab)=>{const items=COPTS.map((o,i)=>[o,i]).filter(([o])=>o.src===src);return items.length?`<optgroup label="${lab}">${items.map(([o,i])=>`<option value="${i}">${optLabel(o)}</option>`).join('')}</optgroup>`:''};
  $('#cSel').innerHTML=`<option value="0">${tt('optMan')}</option>`+grp('fob',tt('grpFob'))+grp('hal',tt('grpHal'));
  if(!calcInit){
    calcInit=true;
    const saved=COPTS.findIndex(o=>o.k===CSTORE._k); $('#cSel').value=saved>=0?saved:(COPTS.length>1?1:0);
    CK.forEach(id=>{ if(CSTORE[id]!=null&&CSTORE[id]!=='') $('#'+id).value=CSTORE[id]; });
    if(saved<0) applyOpt();
    $('#cSel').onchange=()=>{applyOpt();calc()};
    CK.forEach(id=>$('#'+id).oninput=calc);
  } else { const i=COPTS.findIndex(o=>o.k===keep); if(i>=0)$('#cSel').value=i; else if(keep&&keep!=='manual'&&COPTS.length>1){$('#cSel').value=1;applyOpt()} else $('#cSel').value=0; }
  calc();
}
$('#cClear').onclick=()=>{['cBoxes','cFob','cFreight','cPortFee','cInsp','cInland','cOther','cDuty','cMargin'].forEach(id=>$('#'+id).value='');applyOpt();calc()};
function applyOpt(){const o=COPTS[+$('#cSel').value]; if(!o||o.src==='man') return; $('#cSale').value=o.mid.toFixed(2); $('#cKg').value=o.kg?o.kg.toFixed(2):'';}
const val=id=>{const v=parseFloat($('#'+id).value);return isNaN(v)?null:v};
function calc(){
  const o=COPTS[+$('#cSel').value];
  try{const s={_k:o&&o.k};CK.forEach(id=>s[id]=$('#'+id).value);localStorage.setItem('sf_calc',JSON.stringify(s))}catch(e){}
  $('#cMktNote').textContent=!o?'':o.src==='man'?tt('mktMan'):o.src==='hal'?tt('mktHal',o.mk,dF(o.d),fmt(o.lo),fmt(o.hi)):tt('mktNote',dF(o.d),fmt(o.lo),fmt(o.hi));
  const sale=val('cSale'),kg=val('cKg'),boxes=val('cBoxes'),fob=val('cFob'),duty=(val('cDuty')||0)/100,margin=(val('cMargin')||0)/100;
  const cont=['cFreight','cPortFee','cInsp','cInland','cOther'].reduce((s,id)=>s+(val(id)||0),0);
  const warn=[]; if(!boxes) warn.push(tt('wBoxes')); if(fob==null) warn.push(tt('wFob')); if(!$('#cDuty').value) warn.push(tt('wDuty'));
  const perBox=boxes?cont/boxes:null, dutyBox=fob!=null?fob*duty:null;
  const landed=(fob!=null&&perBox!=null)?fob+dutyBox+perBox:null;
  const profit=(landed!=null&&sale!=null)?sale-landed:null;
  const pk=v=>v!=null&&kg?`$${fmt(v/kg,2)}`:'–', pb=v=>v!=null?`$${fmt(v,2)}`:'–', pc=v=>v!=null&&boxes?'$'+fmt(v*boxes):'–';
  const cls=profit==null?'':profit>=0?'up':'down';
  let h=`<thead><tr><th></th><th class="n">${tt('rBox')}</th><th class="n">${tt('rKg')}</th><th class="n">${tt('rCont')}</th></tr></thead><tbody>`;
  [['rFob',fob],['rDuty',dutyBox],['rCost',perBox]].forEach(([l,v])=>h+=`<tr><td>${tt(l)}</td><td class="n">${pb(v)}</td><td class="n">${pk(v)}</td><td class="n">${pc(v)}</td></tr>`);
  h+=`<tr class="tot"><td>${tt('rLanded')}</td><td class="n">${pb(landed)}</td><td class="n">${pk(landed)}</td><td class="n">${pc(landed)}</td></tr>`;
  h+=`<tr><td>${tt('rSale')}</td><td class="n">${pb(sale)}</td><td class="n">${pk(sale)}</td><td class="n">${pc(sale)}</td></tr>`;
  h+=`<tr class="tot"><td>${tt('rProfit')}</td><td class="n ${cls}">${pb(profit)}</td><td class="n ${cls}">${pk(profit)}</td><td class="n ${cls}">${pc(profit)}</td></tr>`;
  h+=`<tr><td>${tt('rMargin')}</td><td class="n ${cls}" colspan="3">${profit!=null&&sale?tt('pct',fmt(profit/sale*100,1)):'–'}</td></tr>`;
  $('#cRes').innerHTML=h+'</tbody>';
  if(sale!=null&&perBox!=null){
    const mx=(sale*(1-margin)-perBox)/(1+duty);
    $('#cMax').textContent=mx>0?tt('maxV',fmt(mx,2)):tt('maxNo');
    $('#cMaxKg').textContent=mx>0&&kg?tt('maxKg',fmt(mx/kg,2),fmt(margin*100,1),fmt(sale,2)):'';
  } else {$('#cMax').textContent='–';$('#cMaxKg').textContent=tt('maxWait')}
  $('#cWarn').innerHTML=warn.map(w=>'• '+w).join('<br>');
}

// ================= upload + persistent save =================
let ART=null; const SERVER_MODE=true; $('#upBtn').style.display='none';
$('#upBtn').onclick=()=>$('#file').click();
$('#file').onchange=e=>{const fs=[...e.target.files];e.target.value='';ingest(fs)};
document.addEventListener('dragover',e=>{e.preventDefault();document.body.classList.add('drop-over')});
document.addEventListener('dragleave',e=>{if(e.target===document.documentElement||e.clientX===0)document.body.classList.remove('drop-over')});
document.addEventListener('drop',e=>{e.preventDefault();document.body.classList.remove('drop-over');if(e.dataTransfer.files.length)ingest([...e.dataTransfer.files])});
const isoUS=s=>{const m=String(s||'').match(/^(\d{2})\/(\d{2})\/(\d{4})/);return m?`${m[3]}-${m[1]}-${m[2]}`:''};
const num=v=>{if(v==null||v==='')return null;const n=parseFloat(String(v).replace(/,/g,''));return isNaN(n)?null:n};
const na=v=>{v=String(v??'').trim();return v==='N/A'?'':v};
function convVol(rows){
  return rows.filter(x=>String(x['import/Export']||'').startsWith('I')&&KEEP.has(x.commodity)&&!String(x.asw_Flag||'').includes('Week Ending')&&!/dried|frozen/i.test(x.properties||''))
    .map(x=>{const rb=isoUS(x.report_begin_date);return [isoUS(x.asw_date)||rb,rb,String(x.slug_id||''),x.commodity,x.origin||'',x.district||'',x.trans_Mode||'',num(x['1 lb units'])||0]}).filter(r=>r[0]&&r[1]);
}
function convPrice(rows){
  return rows.filter(x=>KEEP.has(x.commodity)).map(x=>[isoUS(x.report_date),String(x.slug_id||''),x.commodity,x.district||'',na(x.var),na(x.pkg),na(x.item_size),num(x.low_price),num(x.high_price),num(x.mostly_low_price),num(x.mostly_high_price),x.supply_tone_comments||'',x.demand_tone_comments||'',x.market_tone_comments||'',x.rep_cmt||'']).filter(r=>r[0]);
}
function convHal(rows,markets){
  const agg=new Map();
  rows.forEach(x=>{
    if(!KEEP.has(x.commodity)||x.organic==='Y')return;
    const lo=num(x.low_price),hi=num(x.high_price),ml=num(x.mostly_low_price),mh=num(x.mostly_high_price);
    const a=ml??lo,b=mh??hi; if(a==null||b==null)return;
    const slug=String(x.slug_id||''); markets[slug]=String(x.market_location_name||slug).replace(' Terminal Market','').trim();
    const k=[isoUS(x.report_date),slug,x.commodity,na(x.origin),na(x.variety),na(x.package),na(x.grade)].join('\u0001');
    let g=agg.get(k); if(!g){g={sizes:[],lo:lo??a,hi:hi??b,s:0,n:0,tone:''};agg.set(k,g)}
    const sz=na(x.item_size); if(sz&&!g.sizes.includes(sz))g.sizes.push(sz);
    g.lo=Math.min(g.lo,lo??a); g.hi=Math.max(g.hi,hi??b); g.s+=(a+b)/2; g.n++; if(!g.tone&&x.market_tone_comments)g.tone=x.market_tone_comments;
  });
  return [...agg.entries()].map(([k,g])=>{const p=k.split('\u0001');return [p[0],p[1],p[2],p[3],p[4],p[5],g.sizes.join(', '),g.lo,g.hi,Math.round(g.s/g.n*1000)/1000,g.tone,p[6]||'']}).filter(r=>r[0]);
}
function mergeRows(old,neu,slugI,keyI){
  const rng={}; neu.forEach(r=>{const s=r[slugI],k=r[keyI];const g=rng[s]||(rng[s]=[k,k]);if(k<g[0])g[0]=k;if(k>g[1])g[1]=k});
  const kept=old.filter(r=>{const g=rng[r[slugI]];return !(g&&r[keyI]>=g[0]&&r[keyI]<=g[1])});
  return kept.concat(neu).sort((a,b)=>a[keyI]<b[keyI]?-1:a[keyI]>b[keyI]?1:0);
}
async function ingest(files){
  if(SERVER_MODE) return;
  const D={meta:{...RAW.meta},markets:{...RAW.markets},vol:RAW.vol,price:RAW.price,hal:RAW.hal,cen:RAW.cen||[],halw:RAW.halw||[]};
  const kinds=[]; let changed=false;
  $('#busyT').textContent=tt('busyT');$('#busyS').textContent=tt('busyS');$('#busy').classList.add('on');
  await new Promise(r=>setTimeout(r,30));
  try{
    for(const f of files){
      const rows=Papa.parse(await f.text(),{header:true,skipEmptyLines:true}).data; if(!rows.length) continue;
      const h=Object.keys(rows[0]);
      if(h.includes('usd_kg')&&h.includes('hafta')){
        const nw=rows.filter(x=>x.hafta&&KEEP.has(x.commodity)&&num(x.usd_kg)!=null).map(x=>{const s=String(x.slug_id||'');if(x.market&&!D.markets[s])D.markets[s]=x.market;return [x.hafta,s,x.commodity,na(x.origin),+x.n||1,num(x.usd_kg)]});
        D.halw=mergeRows(D.halw,nw,1,0); kinds.push(tt('kindW')+` (${fmt(nw.length)})`); changed=true;
      } else if(h.includes('GEN_VAL_MO')){
        const nc=rows.filter(x=>x.time&&x.I_COMMODITY).map(x=>[x.time,x.CTY_NAME||'',x.I_COMMODITY,x.DIST_NAME||'',num(x.GEN_VAL_MO)||0,num(x.GEN_CIF_MO)||0,num(x.GEN_QY1_MO)||0,x.UNIT_QY1||'',num(x.CNT_VAL_MO)||0,num(x.CNT_WGT_MO)||0,num(x.VES_VAL_MO)||0,num(x.VES_WGT_MO)||0]);
        const ts=nc.map(r=>r[0]).sort(); const a=ts[0],b=ts.at(-1);
        D.cen=D.cen.filter(r=>!(r[0]>=a&&r[0]<=b)).concat(nc).sort((x,y)=>x[0]<y[0]?-1:x[0]>y[0]?1:0); kinds.push(tt('kindC')+` (${fmt(nc.length)})`); changed=true;
      } else if(h.includes('1 lb units')){
        const nv=convVol(rows); const pub=rows.map(x=>isoUS(x.report_date)).filter(Boolean).sort().at(-1);
        if(pub&&(!D.meta.vPub||pub>D.meta.vPub))D.meta.vPub=pub;
        D.vol=mergeRows(D.vol,nv,2,1); kinds.push(tt('kindV')+` (${fmt(nv.length)})`); changed=true;
      } else if(h.includes('low_price')&&(h.includes('basis_of_sale')||String(rows[0].market_type||'')==='Shipping Point')){
        const np=convPrice(rows); D.price=mergeRows(D.price,np,1,0); kinds.push(tt('kindP')+` (${fmt(np.length)})`); changed=true;
      } else if(h.includes('low_price')&&(String(rows[0].market_type||'')==='Terminal'||h.includes('offerings_comments'))){
        const nh=convHal(rows,D.markets); D.hal=mergeRows(D.hal,nh,1,0); kinds.push(tt('kindH')+` (${fmt(nh.length)})`); changed=true;
      } else toast(tt('tBad',f.name));
    }
  }catch(e){ $('#busy').classList.remove('on'); toast(tt('tErr',e.message||e)); return; }
  if(!changed){ $('#busy').classList.remove('on'); return; }
  RAW=D; load(); setLang(LANG);
  toast(tt('tAdded',kinds.join(', ')));
  // persist for everyone
  let saved=false;
  if(ART){
    const html=buildHtml(D);
    if(html.length>15.5*1024*1024){ toast(tt('tBig'),6000); }
    else{
      try{ await ART.publish(html); saved=true; toast(tt('tSaved'),6000); }
      catch(e){ const c=String(e&&(e.code||e.name||e.message)||e); if(/conflict/i.test(c)) toast(tt('tConflict'),6000); else if(/not_granted|not_writer/i.test(c)) toast(tt('tLocal'),6000); else toast(tt('tErr',c),6000); }
    }
  } else toast(tt('tLocal'),6000);
  $('#busy').classList.remove('on');
}

(function(){
  $('#busyT').textContent=LANG==='tr'?'Veriler yükleniyor…':'Loading data…'; $('#busyS').textContent=''; $('#busy').classList.add('on');

      if(E.meta&&E.meta.updatedAt){const s=document.createElement('span');s.textContent=(LANG==='tr'?' · Son otomatik güncelleme: ':' · Last automatic update: ')+new Date(E.meta.updatedAt).toLocaleString(LANG==='tr'?'tr-TR':'en-US');$('#dataInfo').appendChild(s)}})
    .catch(e=>{if(e.message==='login')return;$('#busyT').textContent=(LANG==='tr'?'Veri yüklenemedi: ':'Could not load data: ')+e.message;$('#busyS').textContent=''});
  const wm=document.createElement('div');wm.className='wm';wm.textContent=(window.SF_USER_EMAIL?window.SF_USER_EMAIL+' · ':'')+'© Sweet Fresh — '+(LANG==='tr'?'yalnızca dahili kullanım':'internal use only');document.body.appendChild(wm);
})();
