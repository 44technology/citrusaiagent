services:
  - type: web
    name: citrus-ai-caller-api
    runtime: node
    buildCommand: npm install && npx prisma db push
    startCommand: node src/index.js
    rootDir: server
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: citrus-db
          property: connectionString
      - key: PORT
        value: "3001"
      - key: BLAND_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: BASE_URL
        sync: false
      - key: NODE_ENV
        value: production

databases:
  - name: citrus-db
    plan: free
